</style></head><body><header><div class="wrap"><div class="top"><div><h1>PL-300 — Banque 1 nettoyée</h1><p>Quiz interactif + mode fiches • version autonome</p></div><div id="score">Score : 0 / 0</div></div><div class="tabs"><button id="quizTab" class="active">Quiz</button><button id="cardsTab">Fiches</button></div></div></header><main class="wrap"><section id="quiz"><div class="toolbar"><select id="filterVolet"><option value="all">Tous les volets</option></select><select id="filterLevel"><option value="all">Tous les niveaux</option><option>Facile</option><option>Intermédiaire</option><option>Difficile</option></select><button class="btn" id="shuffle">Mélanger</button><button class="btn" id="reset">Réinitialiser</button></div><div class="stats"><div class="stat"><b id="total">0</b>questions</div><div class="stat"><b id="answered">0</b>répondues</div><div class="stat"><b id="good">0</b>bonnes réponses</div><div class="stat"><b id="pct">0%</b>réussite</div></div><div class="card"><div class="meta" id="meta"></div><div class="progress"><i id="bar"></i></div><p class="question" id="q"></p><div id="opts"></div><div id="fb" class="feedback hidden"></div><div class="nav"><button class="btn" id="prev">← Précédente</button><button class="btn primary" id="next">Suivante →</button></div></div></section><section id="cards" class="hidden"><div class="toolbar"><select id="cardVolet"><option value="all">Tous les volets</option></select><input id="search" placeholder="Rechercher une notion ou une question…"></div><div id="cardGrid" class="grid"></div></section></main><script>const BANK=[{"id": "V1-01", "volet": "Volet 1", "theme": "Types d’analytique", "level": "Facile", "q": "Quel type d’analytique décrit ce qui s’est passé dans les ventes l’année dernière ?", "a": ["Descriptive", "Diagnostic", "Predictive", "Prescriptive"], "c": 0, "e": "L’analytique descriptive quantifie et présente ce qui s’est produit dans le passé."}, {"id": "V1-02", "volet": "Volet 1", "theme": "Types d’analytique", "level": "Facile", "q": "Les ventes ont diminué. Vous cherchez à comprendre pourquoi. Quel type d’analytique utilisez-vous ?", "a": ["Descriptive", "Diagnostic", "Predictive", "Prescriptive"], "c": 1, "e": "L’analytique diagnostique cherche les causes ou facteurs expliquant un résultat observé."}, {"id": "V1-03", "volet": "Volet 1", "theme": "Types d’analytique", "level": "Facile", "q": "Vous devez estimer les ventes des six prochains mois. Quel type d’analytique utilisez-vous ?", "a": ["Descriptive", "Diagnostic", "Predictive", "Prescriptive"], "c": 2, "e": "L’analytique prédictive estime des résultats futurs à partir de données historiques et d’autres facteurs."}, {"id": "V1-04", "volet": "Volet 1", "theme": "Types d’analytique", "level": "Intermédiaire", "q": "Vous comparez plusieurs stratégies de prix afin de maximiser le bénéfice. Quel type d’analytique utilisez-vous ?", "a": ["Descriptive", "Diagnostic", "Predictive", "Prescriptive"], "c": 3, "e": "L’analytique prescriptive aide à déterminer quelle action ou stratégie choisir parmi des scénarios possibles."}, {"id": "V1-05", "volet": "Volet 1", "theme": "Types d’analytique", "level": "Intermédiaire", "q": "Vous devez analyser automatiquement des milliers de commentaires clients et identifier les thèmes et sentiments. Quel type d’analytique convient ?", "a": ["Descriptive", "Diagnostic", "Predictive", "Cognitive"], "c": 3, "e": "L’analytique cognitive exploite notamment l’IA pour traiter des informations complexes ou non structurées à grande échelle."}, {"id": "V1-06", "volet": "Volet 1", "theme": "Processus", "level": "Intermédiaire", "q": "Quel est l’ordre général allant de la compréhension du passé à la recommandation d’une action ?", "a": ["Descriptive → Diagnostic → Predictive → Prescriptive", "Diagnostic → Descriptive → Prescriptive → Predictive", "Predictive → Descriptive → Diagnostic → Prescriptive", "Prescriptive → Predictive → Diagnostic → Descriptive"], "c": 0, "e": "La progression classique va de ce qui s’est passé, à pourquoi, puis à ce qui pourrait arriver et enfin à ce qu’il serait préférable de faire."}, {"id": "V1-07", "volet": "Volet 1", "theme": "Rôles", "level": "Facile", "q": "Vous devez créer des pipelines qui extraient les données des systèmes sources, les harmonisent et les chargent pour l’analyse. Quel rôle intervient principalement ?", "a": ["Data Engineer", "Data Analyst", "Business Analyst", "Data Scientist"], "c": 0, "e": "Le Data Engineer construit et maintient les flux d’ingestion et de préparation technique des données."}, {"id": "V1-08", "volet": "Volet 1", "theme": "Rôles", "level": "Intermédiaire", "q": "Plusieurs équipes utilisent des définitions différentes du chiffre d’affaires. Vous devez créer un modèle sémantique cohérent et réutilisable. Quel rôle est le plus adapté ?", "a": ["Data Engineer", "Analytics Engineer", "Data Analyst", "Business Analyst"], "c": 1, "e": "L’Analytics Engineer travaille notamment sur les modèles sémantiques et la cohérence des définitions métier réutilisables."}, {"id": "V1-09", "volet": "Volet 1", "theme": "Rôles", "level": "Facile", "q": "Vous créez des rapports et des visualisations à partir d’un modèle sémantique certifié afin d’aider les utilisateurs à prendre des décisions. Quel rôle ?", "a": ["Data Engineer", "Data Scientist", "Data Analyst", "Business Analyst"], "c": 2, "e": "Le Data Analyst transforme les données disponibles en analyses, rapports et visualisations utiles aux décisions."}, {"id": "V1-10", "volet": "Volet 1", "theme": "Rôles", "level": "Facile", "q": "Vous développez un modèle de machine learning pour prévoir les ventes du prochain trimestre. Quel rôle ?", "a": ["Data Analyst", "Analytics Engineer", "Data Scientist", "Business Analyst"], "c": 2, "e": "Le Data Scientist développe notamment des modèles statistiques et de machine learning pour produire des prédictions."}, {"id": "V1-11", "volet": "Volet 1", "theme": "Rôles", "level": "Facile", "q": "Vous traduisez les résultats d’une analyse en recommandations de stratégie commerciale. Quel rôle ?", "a": ["Data Engineer", "Business Analyst", "Data Scientist", "Analytics Engineer"], "c": 1, "e": "Le Business Analyst relie les résultats analytiques aux besoins et décisions métier."}, {"id": "V1-12", "volet": "Volet 1", "theme": "Tâches", "level": "Facile", "q": "Des dates provenant de plusieurs sources utilisent des formats différents. À quelle étape faut-il harmoniser ces formats ?", "a": ["Prepare", "Model", "Visualize", "Manage"], "c": 0, "e": "La préparation consiste notamment à nettoyer et harmoniser les données avant leur modélisation et leur visualisation."}, {"id": "V1-13", "volet": "Volet 1", "theme": "Tâches", "level": "Facile", "q": "Vous devez créer une relation entre une table de ventes et une dimension Produit. À quelle étape cela correspond-il ?", "a": ["Prepare", "Model", "Visualize", "Analyze"], "c": 1, "e": "La création des relations entre tables relève de la modélisation des données."}, {"id": "V1-14", "volet": "Volet 1", "theme": "Tâches", "level": "Intermédiaire", "q": "Vous devez créer une mesure de chiffre d’affaires net à partir du chiffre d’affaires brut, des retours et des remises. À quelle étape ?", "a": ["Prepare", "Model", "Visualize", "Manage"], "c": 1, "e": "Les mesures et calculs métier font partie de la modélisation du modèle sémantique."}, {"id": "V1-15", "volet": "Volet 1", "theme": "Tâches", "level": "Facile", "q": "Vous voulez communiquer clairement l’évolution mensuelle des ventes. Quelle étape du processus concerne la création du graphique ?", "a": ["Prepare", "Model", "Visualize", "Manage"], "c": 2, "e": "La création et la mise en forme des graphiques relève de la visualisation."}, {"id": "V1-16", "volet": "Volet 1", "theme": "Tâches", "level": "Facile", "q": "Vous utilisez Key Influencers pour déterminer les facteurs associés à une variation d’un indicateur. Quelle étape ?", "a": ["Prepare", "Model", "Visualize", "Analyze"], "c": 3, "e": "Key Influencers sert à analyser les facteurs associés à un résultat, au-delà de la simple construction du visuel."}, {"id": "V1-17", "volet": "Volet 1", "theme": "Tâches", "level": "Facile", "q": "Un rapport publié doit continuer à utiliser des données à jour et des connexions fiables. Quelle étape couvre cette activité ?", "a": ["Prepare", "Model", "Analyze", "Manage"], "c": 3, "e": "La gestion couvre notamment l’actualisation, les connexions et la fiabilité du contenu après publication."}, {"id": "V2-01", "volet": "Volet 2", "theme": "Utiliser Power BI", "level": "Facile", "q": "Quel composant Power BI est principalement utilisé pour connecter les données, les transformer, les modéliser et créer des rapports ?", "a": ["Power BI Desktop", "Power BI Service", "Power BI Mobile", "Power BI Gateway"], "c": 0, "e": "Power BI Desktop est l’environnement principal de développement des rapports et de préparation/modélisation des données."}, {"id": "V2-02", "volet": "Volet 2", "theme": "Utiliser Power BI", "level": "Facile", "q": "Quel outil permet de transformer les données dans Power BI Desktop ?", "a": ["Power Query", "DAX Query View", "OneLake Catalog", "Power BI Mobile"], "c": 0, "e": "Power Query fournit les fonctionnalités de connexion, transformation et préparation des données."}, {"id": "V2-03", "volet": "Volet 2", "theme": "Service", "level": "Facile", "q": "Après publication d’un rapport, où l’organiser, le partager et le distribuer ?", "a": ["Power BI Desktop", "Power BI Service", "Power BI Mobile", "Power Query"], "c": 1, "e": "Power BI Service permet notamment de publier, organiser, partager et distribuer le contenu."}, {"id": "V2-04", "volet": "Volet 2", "theme": "Utiliser Power BI", "level": "Facile", "q": "Quel composant est destiné principalement à la consultation sur smartphone ou tablette ?", "a": ["Power BI Desktop", "Power BI Service", "Power BI Mobile", "Power Query"], "c": 2, "e": "Power BI Mobile est conçu pour la consommation des contenus Power BI sur appareils mobiles."}, {"id": "V2-05", "volet": "Volet 2", "theme": "Cycle Power BI", "level": "Intermédiaire", "q": "Quelle séquence représente correctement le flux général de travail Power BI ?", "a": ["Connecter → Transformer → Modéliser → Visualiser → Publier → Distribuer/Gérer", "Visualiser → Connecter → Publier → Transformer → Modéliser → Gérer", "Publier → Modéliser → Connecter → Visualiser → Transformer → Distribuer", "Transformer → Publier → Connecter → Gérer → Modéliser → Visualiser"], "c": 0, "e": "Le flux général commence par l’accès aux données, puis leur préparation et modélisation, la création du rapport, et enfin la publication et la gestion."}, {"id": "V2-06", "volet": "Volet 2", "theme": "Blocs Power BI", "level": "Facile", "q": "Quel élément regroupe les données, relations et calculs nécessaires à l’analyse ?", "a": ["Modèle sémantique", "Rapport", "Tableau de bord", "Espace de travail"], "c": 0, "e": "Le modèle sémantique fournit la structure de données, les relations et les calculs utilisés par les rapports."}, {"id": "V2-07", "volet": "Volet 2", "theme": "Blocs Power BI", "level": "Facile", "q": "Quel élément Power BI contient les pages et les visuels interactifs utilisés pour analyser les données ?", "a": ["Modèle sémantique", "Rapport", "Tableau de bord", "Application"], "c": 1, "e": "Un rapport contient des pages et des visuels permettant une analyse interactive."}, {"id": "V2-08", "volet": "Volet 2", "theme": "Blocs Power BI", "level": "Facile", "q": "Quel élément du Power BI Service présente une vue synthétique sous forme de vignettes sur une seule page ?", "a": ["Rapport", "Modèle sémantique", "Tableau de bord", "Dataflow"], "c": 2, "e": "Un tableau de bord est une page unique composée de vignettes épinglées, utilisée notamment pour une vue synthétique."}, {"id": "V2-09", "volet": "Volet 2", "theme": "Interactivité", "level": "Intermédiaire", "q": "Dans un rapport, la sélection d’un point de données peut-elle affecter d’autres visuels ?", "a": ["Oui, selon les interactions configurées", "Non, jamais", "Oui, uniquement dans Power BI Mobile", "Oui, mais uniquement après export PDF"], "c": 0, "e": "Les interactions entre visuels permettent notamment de filtrer ou de mettre en évidence les données d’autres visuels."}, {"id": "V2-10", "volet": "Volet 2", "theme": "Service", "level": "Intermédiaire", "q": "Vous souhaitez distribuer une sélection contrôlée de contenu à des consommateurs sans leur donner l’accès complet à l’espace de travail. Que privilégier ?", "a": ["Une application Power BI", "Le dossier Desktop local", "Power Query", "Une relation du modèle"], "c": 0, "e": "Une application Power BI permet de présenter une sélection de contenu à un public donné sans exposer toute l’expérience de l’espace de travail."}, {"id": "V2-11", "volet": "Volet 2", "theme": "Service", "level": "Intermédiaire", "q": "Une organisation souhaite partir d’une solution Power BI existante puis la connecter à ses propres données. Quelle fonctionnalité est adaptée ?", "a": ["Application de modèle (Template App)", "Power BI Mobile", "DAX Query View", "Key Influencers"], "c": 0, "e": "Une Template App permet de partir d’une solution existante et de la configurer avec les données de l’organisation."}, {"id": "V2-12", "volet": "Volet 2", "theme": "Service", "level": "Intermédiaire", "q": "Après avoir modifié un rapport dans un espace de travail, que faut-il faire pour que les consommateurs de l’application voient la nouvelle version ?", "a": ["Mettre à jour l’application", "Recréer les relations", "Modifier le type d’un visuel", "Exporter le rapport en CSV"], "c": 0, "e": "Les modifications du contenu de l’espace de travail ne deviennent pas automatiquement une nouvelle version distribuée de l’application ; il faut mettre à jour l’application."}, {"id": "V3-01", "volet": "Volet 3", "theme": "Fabric", "level": "Intermédiaire", "q": "Quel est l’objectif principal de Microsoft Fabric dans l’analytique de bout en bout ?", "a": ["Unifier les outils et expériences analytiques autour d’une plateforme SaaS intégrée", "Remplacer tous les langages de programmation par SQL", "Stocker uniquement des fichiers CSV", "Limiter l’analytique aux tableaux de bord"], "c": 0, "e": "Fabric rassemble différentes expériences analytiques dans une plateforme SaaS intégrée et s’appuie notamment sur OneLake."}, {"id": "V3-02", "volet": "Volet 3", "theme": "OneLake", "level": "Facile", "q": "Quel rôle joue OneLake dans Microsoft Fabric ?", "a": ["Fournir un stockage logique centralisé pour les données de l’organisation", "Créer uniquement des rapports Power BI", "Remplacer les espaces de travail", "Servir uniquement aux modèles ML"], "c": 0, "e": "OneLake constitue le lac de données logique centralisé de Fabric."}, {"id": "V3-03", "volet": "Volet 3", "theme": "OneLake", "level": "Intermédiaire", "q": "Vous devez accéder à des données existantes dans Amazon S3 sans créer une copie dans OneLake. Quelle fonctionnalité utiliser ?", "a": ["Shortcut", "Mesure DAX", "Application Power BI", "Quick measure"], "c": 0, "e": "Un shortcut référence des données existantes sans nécessiter leur copie dans OneLake."}, {"id": "V3-04", "volet": "Volet 3", "theme": "Fabric", "level": "Facile", "q": "Vous devez automatiser l’ingestion quotidienne de données provenant de plusieurs sources. Quel composant privilégier ?", "a": ["Pipeline", "Rapport paginé", "Key Influencers", "Tableau de bord"], "c": 0, "e": "Les pipelines servent notamment à orchestrer et automatiser des flux d’ingestion et de traitement."}, {"id": "V3-05", "volet": "Volet 3", "theme": "Fabric", "level": "Facile", "q": "Un Data Scientist souhaite développer des traitements avec Python et Spark. Quel composant est adapté ?", "a": ["Notebook", "Dashboard", "Power BI Mobile", "OneLake Catalog"], "c": 0, "e": "Les notebooks Fabric prennent notamment en charge des scénarios Python et Spark pour l’ingénierie et la data science."}, {"id": "V3-06", "volet": "Volet 3", "theme": "Fabric", "level": "Intermédiaire", "q": "Vous devez réaliser des transformations de données en amont avant leur utilisation analytique, sans développer un notebook complexe. Quel outil peut convenir ?", "a": ["Dataflow", "Tableau de bord", "Application", "Vignette"], "c": 0, "e": "Les Dataflows permettent de réaliser des transformations de données de manière réutilisable dans des scénarios de préparation."}, {"id": "V3-07", "volet": "Volet 3", "theme": "Fabric", "level": "Intermédiaire", "q": "Les analystes doivent accéder directement aux données OneLake sans multiplier les copies ou importations. Quelle technologie est particulièrement adaptée ?", "a": ["Direct Lake", "Power BI Mobile", "Template App", "DAX Query View"], "c": 0, "e": "Direct Lake permet au moteur Power BI de lire directement les données stockées dans OneLake dans les scénarios pris en charge."}, {"id": "V3-08", "volet": "Volet 3", "theme": "Gouvernance", "level": "Facile", "q": "Vous devez rechercher les données disponibles auxquelles l’utilisateur a accès. Quel composant utiliser ?", "a": ["OneLake Catalog", "Power BI Mobile", "DAX Query View", "Quick measures"], "c": 0, "e": "OneLake Catalog sert notamment à découvrir et rechercher les données accessibles."}, {"id": "V3-09", "volet": "Volet 3", "theme": "Gouvernance", "level": "Facile", "q": "Vous voulez visualiser les dépendances et le flux entre des éléments Fabric. Quelle fonctionnalité utiliser ?", "a": ["Lineage", "Key Influencers", "Power Query", "Quick measure"], "c": 0, "e": "La vue de lignage permet de suivre les dépendances et les relations entre les éléments de données et d’analytique."}, {"id": "V3-10", "volet": "Volet 3", "theme": "Fabric IQ", "level": "Difficile", "q": "Vous devez représenter les concepts métier, leurs relations et leurs règles pour donner du contexte aux expériences d’IA. Quel concept Fabric IQ intervient ?", "a": ["Ontology", "Power BI Mobile", "Gateway", "Dashboard"], "c": 0, "e": "L’ontologie décrit les concepts métier, leurs relations et les règles utiles au raisonnement orienté métier."}, {"id": "V3-11", "volet": "Volet 3", "theme": "Data Agent", "level": "Intermédiaire", "q": "Les utilisateurs veulent poser des questions en langage naturel sur des données structurées. Quelle capacité Fabric est adaptée ?", "a": ["Data Agent", "Power BI Mobile", "Template App", "Power Query Editor"], "c": 0, "e": "Un Data Agent peut exploiter des sources de données structurées pour répondre à des questions en langage naturel."}, {"id": "V4-01", "volet": "Volet 4", "theme": "Préparer les données", "level": "Facile", "q": "Des valeurs sont absentes dans une colonne importante. Quel aspect de qualité des données est concerné ?", "a": ["Complétude", "Validité", "Unicité", "Cohérence"], "c": 0, "e": "La complétude concerne la présence des valeurs attendues et l’absence de données manquantes problématiques."}, {"id": "V4-02", "volet": "Volet 4", "theme": "Préparer les données", "level": "Facile", "q": "Des valeurs sont en dehors de la plage attendue. Quel aspect de qualité est concerné ?", "a": ["Validité", "Complétude", "Unicité", "Cohérence"], "c": 0, "e": "La validité vérifie notamment que les valeurs respectent les contraintes ou domaines attendus."}, {"id": "V4-03", "volet": "Volet 4", "theme": "Préparer les données", "level": "Facile", "q": "Les dates sont représentées avec des formats incohérents selon les lignes. Quel aspect est concerné ?", "a": ["Cohérence", "Complétude", "Unicité", "Validité"], "c": 0, "e": "La cohérence concerne l’homogénéité des représentations et des règles entre les données."}, {"id": "V4-04", "volet": "Volet 4", "theme": "Préparer les données", "level": "Facile", "q": "Des lignes sont présentes plusieurs fois alors qu’elles devraient être uniques. Quel aspect est concerné ?", "a": ["Unicité", "Complétude", "Validité", "Cohérence"], "c": 0, "e": "L’unicité concerne l’absence de doublons lorsque chaque enregistrement est censé être unique."}, {"id": "V4-05", "volet": "Vole
